name: asp-backend

services:
  postgres:
    image: postgres:16
    container_name: asp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asp
      POSTGRES_PASSWORD: asp123
      POSTGRES_DB: asp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asp -d asp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fake mailbox for development: every email the API sends shows up at http://localhost:8025
  mailpit:
    image: axllent/mailpit
    container_name: asp-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # web page
      - "1025:1025" # SMTP

  api:
    build: ./api
    container_name: asp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/asp
      DB_USER: asp
      DB_PASSWORD: asp123
      # Secret used to sign login tokens (minimum 32 characters). Change it in production!
      JWT_SECRET: dev-secret-change-in-production-0123456789
      # First admin user (created only if it does not exist yet). Change it in production!
      ADMIN_EMAIL: admin@asp.local
      ADMIN_PASSWORD: admin123
      # Where uploaded photos/videos are stored (kept in the "files" volume below)
      FILES_DIR: /data/files
      # Emails: Mailpit in development
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply@asp.local
    volumes:
      - files:/data/files
    ports:
      - "8080:8080"

volumes:
  pgdata:
  files:
